services:
  backend:
    build:
      context: ./backend
    container_name: boc-monitor-backend
    environment:
      PORT: 3001
      REQUEST_TIMEOUT_MS: 10000
      BOC_SOURCE_URL: https://www.boc.cn/sourcedb/whpj/
      CORS_ORIGIN: "*"
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: boc-monitor-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped
